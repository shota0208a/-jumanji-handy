<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">

<title>ハンディ</title>

<style>
:root{
  --bg:#0d0d10;
  --panel:#18181d;
  --panel2:#24242c;
  --line:#35353e;
  --text:#f5f5f7;
  --muted:#aaaab5;
  --gold:#e3b84d;
  --green:#32d16d;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

button,input,select{font:inherit}

.app{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  padding:14px 14px 30px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 2px 14px;
  background:rgba(13,13,16,.96);
  backdrop-filter:blur(10px);
}

.title{
  font-size:25px;
  font-weight:900;
  color:var(--gold);
}

.top-actions{
  display:flex;
  gap:8px;
}

.top-btn{
  border:0;
  border-radius:12px;
  padding:11px 13px;
  background:var(--panel2);
  color:white;
  font-weight:800;
}

.section{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.section h2{
  margin:0 0 10px;
  font-size:19px;
}

.sub{
  font-size:13px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.table{
  min-height:125px;
  padding:16px;
  border-radius:18px;
  border:1px solid rgba(50,209,109,.5);
  background:#18181e;
  color:white;
  text-align:left;
}

.table.paid{
  opacity:.55;
  border-color:#555;
}

.table-name{
  font-size:24px;
  font-weight:900;
}

.table-info{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  background:rgba(50,209,109,.15);
  color:#76ee9e;
}

.amount{
  margin-top:10px;
  font-size:22px;
  font-weight:900;
  text-align:right;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.row:last-child{border-bottom:0}

.name{
  font-weight:800;
}

.small{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  line-height:1.4;
}

.qty{
  display:flex;
  align-items:center;
  gap:9px;
}

.qty button{
  width:44px;
  height:44px;
  border:0;
  border-radius:12px;
  background:#2c2c35;
  color:white;
  font-size:22px;
  font-weight:900;
}

.qty span{
  min-width:28px;
  text-align:center;
  font-size:19px;
  font-weight:900;
}

input[type="number"],select{
  width:130px;
  background:#272730;
  color:white;
  border:1px solid #44444e;
  border-radius:11px;
  padding:11px;
  text-align:right;
}

input[type="checkbox"]{
  width:20px;
  height:20px;
  accent-color:var(--gold);
}

.total-row{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.grand{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding-top:14px;
}

.grand strong{
  color:var(--gold);
  font-size:36px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.actions button{
  border:0;
  border-radius:14px;
  padding:15px 10px;
  font-weight:900;
}

.save{
  background:var(--gold);
  color:#111;
}

.dark{
  background:#292932;
  color:white;
}

.reset{
  grid-column:1 / -1;
  background:#292932;
  color:white;
}

.hidden{display:none!important}
</style>
</head>

<body>

<div class="app">

<div class="topbar">
  <div class="title">ハンディ</div>

  <div class="top-actions">
    <button id="backBtn" class="top-btn hidden">← 戻る</button>
    <button id="shareBtn" class="top-btn hidden" onclick="shareTable()">共有</button>
  </div>
</div>


<!-- 卓一覧 -->

<div id="home">

<div class="section">
<h2>卓一覧</h2>
<div class="sub">V1〜V3 / SV1〜SV3</div>
</div>

<div class="grid" id="tableGrid"></div>

</div>


<!-- 注文画面 -->

<div id="order" class="hidden">

<div class="section">
<h2 id="tableTitle"></h2>
<div class="sub">伝票入力</div>
</div>


<!-- 人数 -->

<div class="section">

<h2>人数</h2>

<div class="row">

<div>
<div class="name">ゲスト数</div>
<div class="small">TC計算に使用</div>
</div>

<div class="qty">
<button onclick="guest(-1)">−</button>
<span id="guest">1</span>
<button onclick="guest(1)">＋</button>
</div>

</div>

</div>


<!-- ボトル -->

<div class="section">

<h2>🍾 ボトル</h2>

<div class="sub">
ボトル価格にTAX10%を自動加算
</div>

<div id="bottleList"></div>

</div>


<!-- TC SC -->

<div class="section">

<h2>TC / SC</h2>

<div class="row">

<div>
<div class="name">TC</div>
<div class="small">ON / OFF</div>
</div>

<input id="tcOn" type="checkbox" onchange="recalc()">

</div>


<div class="row">

<div>
<div class="name">TC金額（1名）</div>
<div class="small">自由入力</div>
</div>

<input id="tcPrice"
type="number"
value="3000"
oninput="recalc()">

</div>


<div class="row">

<div>
<div class="name">SC</div>
<div class="small">ON / OFF</div>
</div>

<input id="scOn"
type="checkbox"
onchange="recalc()">

</div>


<div class="row">

<div>
<div class="name">SC率</div>
<div class="small">0% / 10% / 20%</div>
</div>

<select id="scRate" onchange="recalc()">

<option value="0">0%</option>
<option value="10">10%</option>
<option value="20">20%</option>

</select>

</div>

</div>


<!-- セット -->

<div class="section">

<h2>🎉 セット</h2>

<div class="sub">
各 ¥50,000 / SC10% / TAX10% / TCなし
</div>

<div id="setList"></div>

</div>


<!-- 端数 -->

<div class="section">

<h2>端数処理</h2>

<div class="row">

<div>
<div class="name">切り捨て</div>
</div>

<select id="rounding" onchange="recalc()">

<option value="0">なし</option>
<option value="10">10円未満</option>
<option value="100">100円未満</option>
<option value="1000">1,000円未満</option>

</select>

</div>

</div>


<!-- 計算 -->

<div class="section">

<h2>計算結果</h2>

<div class="total-row">
<span>ボトル税抜</span>
<strong id="base">¥0</strong>
</div>

<div class="total-row">
<span>ボトル TAX10%</span>
<strong id="tax">¥0</strong>
</div>

<div class="total-row">
<span>ボトル税込</span>
<strong id="taxin">¥0</strong>
</div>

<div class="total-row">
<span>TC</span>
<strong id="tc">¥0</strong>
</div>

<div class="total-row">
<span>SC</span>
<strong id="sc">¥0</strong>
</div>

<div class="total-row">
<span>セット</span>
<strong id="settotal">¥0</strong>
</div>

<div class="total-row">
<span>端数切り捨て</span>
<strong id="rounddown">¥0</strong>
</div>

<div class="grand">

<span>合計</span>

<strong id="grand">¥0</strong>

</div>

</div>


<div class="actions">

<button class="save" onclick="save()">保存</button>

<button class="dark" onclick="paid()">会計済み</button>

<button class="reset" onclick="reset()">リセット</button>

</div>

</div>

</div>


<script>

const TABLES=[
"V1","V2","V3",
"SV1","SV2","SV3"
];


const BOTTLES=[

["マム グランコルドン",22000],

["マム グランコルドン ロゼ",25000],

["マム アイス エクストラ",26000],

["ペリエ ジュエ グラン ブリュット",24000],

["ベル エポック",75000],

["ベル エポック ロゼ",135000],

["アルマンド ゴールド",150000]

];


const SETS=["A","B","C","D","E"];

const SET_PRICE=50000;

const STORAGE="handy_v2";


function newOrder(){

return{

guests:1,

bottles:Array(BOTTLES.length).fill(0),

sets:{
A:0,
B:0,
C:0,
D:0,
E:0
},

tcOn:true,

tcPrice:3000,

scOn:true,

scRate:20,

rounding:0,

paid:false

};

}


let orders={};

let current=null;


try{

orders=
JSON.parse(
localStorage.getItem(STORAGE)
)||{};

}catch(e){

orders={};

}


TABLES.forEach(t=>{

if(!orders[t])

orders[t]=newOrder();

});


function yen(n){

return "¥"+
Math.round(n||0)
.toLocaleString("ja-JP");

}


function store(){

localStorage.setItem(
STORAGE,
JSON.stringify(orders)
);

}


function calculate(o){

let bottleBase=0;


o.bottles.forEach((q,i)=>{

bottleBase+=
BOTTLES[i][1]*(q||0);

});


const bottleTax=
bottleBase*0.10;


const bottleWithTax=
bottleBase+bottleTax;



/*
重要：

ボトル注文がない場合
TC・SCは0円
*/

const hasBottle=
bottleBase>0;



const tc=

(hasBottle && o.tcOn)

?

Number(o.tcPrice||0)
*
Number(o.guests||1)

:

0;



const scRate=

(hasBottle && o.scOn)

?

Number(o.scRate||0)/100

:

0;



const sc=

(bottleWithTax+tc)
*
scRate;



let setBase=0;


SETS.forEach(s=>{

setBase+=

(o.sets[s]||0)

*

SET_PRICE;

});


/*
セット

50,000
↓
SC10%
↓
TAX10%

=60,500
*/

const setTotal=

setBase
*
1.10
*
1.10;



let beforeRound=

bottleWithTax
+
tc
+
sc
+
setTotal;



let grand=
beforeRound;


let roundDown=0;


const unit=
Number(o.rounding||0);


if(unit>0){

grand=

Math.floor(
beforeRound/unit
)
*
unit;


roundDown=
beforeRound-grand;

}


return{

bottleBase,

bottleTax,

bottleWithTax,

tc,

sc,

setTotal,

beforeRound,

roundDown,

grand

};

}


function renderHome(){

const grid=
document.getElementById("tableGrid");


grid.innerHTML="";


TABLES.forEach(t=>{

const o=orders[t];

const c=calculate(o);


const b=
document.createElement("button");


b.className=

"table"+
(o.paid?" paid":"");


b.innerHTML=`

<div>

<div class="table-name">
${t}
</div>

<div class="table-info">
人数 ${o.guests}名
</div>

<div class="status">
${o.paid?"会計済み":"Open"}
</div>

</div>

<div class="amount">
${yen(c.grand)}
</div>

`;


b.onclick=
()=>openTable(t);


grid.appendChild(b);

});

}


function openTable(t){

current=t;


document
.getElementById("home")
.classList
.add("hidden");


document
.getElementById("order")
.classList
.remove("hidden");


document
.getElementById("backBtn")
.classList
.remove("hidden");


document
.getElementById("shareBtn")
.classList
.remove("hidden");


renderOrder();

}


function home(){

store();


current=null;


document
.getElementById("order")
.classList
.add("hidden");


document
.getElementById("home")
.classList
.remove("hidden");


document
.getElementById("backBtn")
.classList
.add("hidden");


document
.getElementById("shareBtn")
.classList
.add("hidden");


renderHome();

}


document
.getElementById("backBtn")
.onclick=home;


function renderOrder(){

const o=orders[current];


document
.getElementById("tableTitle")
.textContent=current;


document
.getElementById("guest")
.textContent=o.guests;


document
.getElementById("tcOn")
.checked=o.tcOn;


document
.getElementById("tcPrice")
.value=o.tcPrice;


document
.getElementById("scOn")
.checked=o.scOn;


document
.getElementById("scRate")
.value=o.scRate;


document
.getElementById("rounding")
.value=o.rounding;



const bl=
document.getElementById("bottleList");


bl.innerHTML="";


BOTTLES.forEach((b,i)=>{


const row=
document.createElement("div");


row.className="row";


row.innerHTML=`

<div>

<div class="name">
${b[0]}
</div>

<div class="small">

${yen(b[1])}

＋ TAX10%

＝ ${yen(b[1]*1.10)}

</div>

</div>


<div class="qty">

<button
onclick="bottle(${i},-1)">
−
</button>

<span id="b${i}">
${o.bottles[i]}
</span>

<button
onclick="bottle(${i},1)">
＋
</button>

</div>

`;


bl.appendChild(row);

});



const sl=
document.getElementById("setList");


sl.innerHTML="";


SETS.forEach(s=>{


const row=
document.createElement("div");


row.className="row";


row.innerHTML=`

<div>

<div class="name">
Set ${s}
</div>

<div class="small">

¥50,000

＋ SC10%

＋ TAX10%

＝ ¥60,500

</div>

</div>


<div class="qty">

<button
onclick="setqty('${s}',-1)">
−
</button>

<span id="s${s}">
${o.sets[s]}
</span>

<button
onclick="setqty('${s}',1)">
＋
</button>

</div>

`;


sl.appendChild(row);

});


recalc();

}


function guest(n){

const o=orders[current];


o.guests=

Math.max(
1,
o.guests+n
);


document
.getElementById("guest")
.textContent=o.guests;


recalc();

}


function bottle(i,n){

const o=orders[current];


o.bottles[i]=

Math.max(
0,
o.bottles[i]+n
);


document
.getElementById("b"+i)
.textContent=
o.bottles[i];


recalc();

}


function setqty(s,n){

const o=orders[current];


o.sets[s]=

Math.max(
0,
o.sets[s]+n
);


document
.getElementById("s"+s)
.textContent=
o.sets[s];


recalc();

}


function readControls(){

const o=orders[current];


o.tcOn=

document
.getElementById("tcOn")
.checked;


o.tcPrice=

Number(
document
.getElementById("tcPrice")
.value
)||0;


o.scOn=

document
.getElementById("scOn")
.checked;


o.scRate=

Number(
document
.getElementById("scRate")
.value
)||0;


o.rounding=

Number(
document
.getElementById("rounding")
.value
)||0;

}


function recalc(){

if(!current)
return;


readControls();


const c=
calculate(
orders[current]
);


document
.getElementById("base")
.textContent=
yen(c.bottleBase);


document
.getElementById("tax")
.textContent=
yen(c.bottleTax);


document
.getElementById("taxin")
.textContent=
yen(c.bottleWithTax);


document
.getElementById("tc")
.textContent=
yen(c.tc);


document
.getElementById("sc")
.textContent=
yen(c.sc);


document
.getElementById("settotal")
.textContent=
yen(c.setTotal);


document
.getElementById("rounddown")
.textContent=

c.roundDown>0

?

"-"+yen(c.roundDown)

:

"¥0";


document
.getElementById("grand")
.textContent=
yen(c.grand);


store();

}


function save(){

readControls();

store();

alert("保存しました");

renderHome();

}


function paid(){

const o=orders[current];

o.paid=!o.paid;

store();

alert(
o.paid
?
"会計済みにしました"
:
"会計済みを解除しました"
);

}


function reset(){

if(
!confirm(
"この卓の伝票をリセットしますか？"
)
)
return;


orders[current]=
newOrder();


store();

renderOrder();

renderHome();

}


async function shareTable(){

const o=
orders[current];


const c=
calculate(o);


let lines=[];


lines.push(
`【${current}】`
);


lines.push(
`${o.guests}名`
);


lines.push("");


let bottleExists=false;


o.bottles.forEach((q,i)=>{

if(q>0){

bottleExists=true;

lines.push(
`${BOTTLES[i][0]} ×${q}`
);

}

});


if(bottleExists)
lines.push("");


SETS.forEach(s=>{

if(o.sets[s]>0){

lines.push(
`Set ${s} ×${o.sets[s]}`
);

}

});


lines.push("");


if(c.tc>0)

lines.push(
`TC ${yen(c.tc)}`
);


if(c.sc>0)

lines.push(
`SC ${o.scRate}% ${yen(c.sc)}`
);


lines.push(
`合計 ${yen(c.grand)}`
);


const text=
lines.join("\n");


try{

if(navigator.share){

await navigator.share({
title:`ハンディ ${current}`,
text:text
});

}

else{

await navigator.clipboard.writeText(text);

alert(
"伝票内容をコピーしました"
);

}

}

catch(e){}

}


load();


function load(){

renderHome();

}

</script>

</body>
</html>
