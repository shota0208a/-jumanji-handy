<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JUMANJI HANDY</title>
<style>
:root{--bg:#080808;--panel:#141414;--panel2:#1d1d1d;--line:#353535;--text:#f7f7f7;--muted:#aaa;--gold:#e4bd48;--gold2:#8e6813;--green:#20c86b;--red:#ff5c5c;--blue:#4aa3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:105px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px 28px}
.hero{text-align:center;padding:10px 0 20px}.hero h1{margin:0;font-size:30px;letter-spacing:.8px;color:var(--gold)}.hero p{margin:6px 0 0;color:var(--muted);letter-spacing:2px;font-size:13px}
.card{background:linear-gradient(180deg,#171717,#111);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px #0008}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.card-title h2{font-size:20px;margin:0}.small{font-size:13px;color:var(--muted)}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.table-btn{border:1px solid #444;background:#222;border-radius:14px;padding:16px 4px;font-weight:800;font-size:18px}.table-btn.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;border-color:var(--gold)}
label{display:block;color:var(--muted);font-size:13px;margin:0 0 7px}.field{width:100%;background:#252525;border:1px solid #444;border-radius:13px;padding:13px 14px;outline:none}.field:focus{border-color:var(--gold)}textarea.field{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.stack{display:grid;gap:10px}
.primary,.secondary,.danger,.success{border:0;border-radius:15px;padding:15px;font-weight:800}.primary{background:linear-gradient(135deg,var(--gold2),#ffd65b);color:#111}.secondary{background:#2b2b2b}.danger{background:#4a1d1d;color:#ffb4b4}.success{background:#123d26;color:#7df0ab}
.icon-btn{width:44px;height:44px;border:0;border-radius:13px;background:#2c2c2c;font-size:24px;font-weight:800}.qty{display:flex;align-items:center;justify-content:center;gap:10px}.qty span{min-width:26px;text-align:center;font-weight:800;font-size:18px}
.switch-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #303030;padding:14px 0}.switch{position:relative;width:58px;height:34px}.switch input{display:none}.slider{position:absolute;inset:0;background:#454545;border-radius:99px}.slider:before{content:"";position:absolute;width:28px;height:28px;left:3px;top:3px;background:white;border-radius:50%;transition:.18s}.switch input:checked+.slider{background:var(--gold2)}.switch input:checked+.slider:before{transform:translateX(24px)}
.segment{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#222;border-radius:13px;padding:4px;gap:4px}.segment button{border:0;background:transparent;border-radius:10px;padding:11px 6px;color:var(--muted);font-weight:700}.segment button.active{background:var(--gold);color:#111}
.list{display:grid;gap:9px}.item{background:#202020;border:1px solid #363636;border-radius:15px;padding:12px}.item-top{display:flex;justify-content:space-between;gap:8px}.item-name{font-weight:800}.item-sub{color:var(--muted);font-size:13px;margin-top:4px}.item-actions{display:flex;align-items:center;gap:7px;margin-top:10px}.item-actions .danger{padding:9px 12px;margin-left:auto}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed #444;border-radius:14px}
.summary{display:grid;gap:9px}.sum-row{display:flex;justify-content:space-between}.sum-row.total-before{border-top:1px solid #444;padding-top:12px;margin-top:5px}.grand{border-top:1px solid var(--gold2);padding-top:14px;margin-top:6px;display:flex;justify-content:space-between;align-items:end}.grand strong{font-size:33px;color:var(--gold)}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:800;background:#292929}.badge.paid{background:#123d26;color:#7df0ab}.badge.open{background:#3b3014;color:#f7d675}
.table-list{display:grid;gap:10px}.table-card{border:1px solid #3b3b3b;background:#1b1b1b;border-radius:17px;padding:14px}.table-card.active{border-color:var(--gold)}.table-head{display:flex;justify-content:space-between;align-items:center}.table-name{font-size:20px;font-weight:900}.table-meta{font-size:12px;color:var(--muted);margin-top:6px}.table-total{font-size:22px;font-weight:900;color:var(--gold);margin-top:9px}.table-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}.table-actions button{padding:10px 4px;border-radius:11px;border:0;background:#303030;font-size:13px;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tabs button{padding:13px;border:0;border-radius:14px;background:#222;font-weight:800}.tabs button.active{background:var(--gold);color:#111}
.hidden{display:none!important}.footer{position:fixed;z-index:20;left:0;right:0;bottom:0;background:#090909ef;border-top:1px solid #4c4120;padding:10px 18px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}.footer-inner{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}.footer-label{font-size:12px;color:var(--muted)}.footer-table{font-size:20px;font-weight:900;color:var(--gold)}.footer-total{font-size:28px;font-weight:900;text-align:right}
.notice{background:#2d2511;border:1px solid #66541a;color:#ffe39a;padding:11px 13px;border-radius:13px;font-size:13px;margin-bottom:12px}
@media(max-width:420px){.row,.row3{grid-template-columns:1fr}.hero h1{font-size:26px}.card{padding:16px}.table-actions{grid-template-columns:1fr 1fr}.footer-total{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <header class="hero"><h1>🍾 JUMANJI HANDY</h1><p>VIP BILL & TABLE MANAGER</p></header>
  <div class="tabs"><button id="tabTables" class="active">卓一覧</button><button id="tabBill">伝票入力</button></div>

  <section id="tablesView">
    <div class="card">
      <div class="card-title"><h2>卓管理</h2><span class="small">6卓を個別保存</span></div>
      <div id="tableList" class="table-list"></div>
    </div>
  </section>

  <section id="billView" class="hidden">
    <div class="card">
      <div class="card-title"><h2>卓選択</h2><span id="selectedStatus" class="badge open">営業中</span></div>
      <div id="tableButtons" class="grid6"></div>
    </div>

    <div class="card">
      <div class="card-title"><h2>基本情報</h2><span class="small">名前・時間・延長</span></div>
      <div class="stack">
        <div><label>お客様名</label><input id="customerName" class="field" placeholder="例：田中様"></div>
        <div class="row"><div><label>開始時間</label><input id="startTime" class="field" type="datetime-local"></div><div><label>終了予定時間</label><input id="endTime" class="field" type="datetime-local"></div></div>
        <div class="row"><div><label>延長回数</label><div class="qty"><button id="extMinus" class="icon-btn">−</button><span id="extensionCount">0</span><button id="extPlus" class="icon-btn">＋</button></div></div><div><label>1回の延長料金</label><input id="extensionPrice" class="field" inputmode="numeric" value="0"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><h2>🍾 ボトル</h2><span class="small">複数追加可能</span></div>
      <div class="row3"><div><label>商品名</label><input id="bottleName" class="field" placeholder="例：マム"></div><div><label>価格</label><input id="bottlePrice" class="field" inputmode="numeric" value="24200"></div><div><label>本数</label><input id="bottleQty" class="field" inputmode="numeric" value="1"></div></div>
      <button id="addBottle" class="primary" style="width:100%;margin-top:11px">ボトルを追加</button>
      <div id="bottleList" class="list" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <div class="card-title"><h2>その他ドリンク</h2><span class="small">名称・金額変更可</span></div>
      <div class="row3"><div><label>商品名</label><input id="drinkName" class="field" placeholder="例：ショット"></div><div><label>単価</label><input id="drinkPrice" class="field" inputmode="numeric" value="1000"></div><div><label>数量</label><input id="drinkQty" class="field" inputmode="numeric" value="1"></div></div>
      <button id="addDrink" class="primary" style="width:100%;margin-top:11px">ドリンクを追加</button>
      <div id="drinkList" class="list" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <div class="card-title"><h2>セット・TC・SC・TAX</h2></div>
      <div class="switch-row"><div><strong>セット</strong><div class="small">料金 × セット数</div></div><label class="switch"><input id="setEnabled" type="checkbox"><span class="slider"></span></label></div>
      <div class="row"><div><label>セット料金</label><input id="setPrice" class="field" inputmode="numeric" value="50000"></div><div><label>セット数</label><input id="setQty" class="field" inputmode="numeric" value="1"></div></div>
      <div class="switch-row"><div><strong>TC</strong><div class="small">料金 × 人数</div></div><label class="switch"><input id="tcEnabled" type="checkbox"><span class="slider"></span></label></div>
      <div class="row"><div><label>TC料金</label><input id="tcPrice" class="field" inputmode="numeric" value="3000"></div><div><label>人数</label><input id="tcPeople" class="field" inputmode="numeric" value="1"></div></div>
      <div class="switch-row"><div><strong>SC</strong><div class="small">小計に対するサービス料</div></div><label class="switch"><input id="scEnabled" type="checkbox"><span class="slider"></span></label></div>
      <div id="scSegment" class="segment"><button data-value="0">0%</button><button data-value="10" class="active">10%</button><button data-value="20">20%</button></div>
      <div class="switch-row"><div><strong>TAX</strong><div class="small">SC加算後に10%</div></div><label class="switch"><input id="taxEnabled" type="checkbox" checked><span class="slider"></span></label></div>
    </div>

    <div class="card">
      <div class="card-title"><h2>端数処理</h2></div>
      <div id="roundSegment" class="segment"><button data-value="1">なし</button><button data-value="10">10円</button><button data-value="100" class="active">100円</button><button data-value="1000">千円</button></div>
    </div>

    <div class="card">
      <div class="card-title"><h2>メモ・支払方法</h2></div>
      <label>メモ</label><textarea id="memo" class="field" placeholder="担当者、注意事項など"></textarea>
      <label style="margin-top:12px">支払方法</label>
      <select id="paymentMethod" class="field"><option>未選択</option><option>現金</option><option>カード</option><option>現金＋カード</option><option>その他</option></select>
    </div>

    <div class="card">
      <div class="card-title"><h2>会計内訳</h2></div>
      <div id="summary" class="summary"></div>
    </div>

    <div class="card">
      <div class="stack">
        <button id="shareLine" class="primary">LINEで共有</button>
        <button id="togglePaid" class="success">会計済みにする</button>
        <button id="resetTable" class="danger">この卓を新規会計に戻す</button>
      </div>
    </div>
  </section>
</div>

<footer class="footer"><div class="footer-inner"><div><div class="footer-label">現在の卓</div><div id="footerTable" class="footer-table">V1</div></div><div><div class="footer-label" style="text-align:right">お会計</div><div id="footerTotal" class="footer-total">0円</div></div></div></footer>
<script>
(()=>{
const TABLES=['V1','V2','V3','SV1','SV2','SV3'];
const KEY='jumanjiHandyFullV3';
const yen=n=>Math.max(0,Number(n)||0).toLocaleString('ja-JP')+'円';
const num=v=>Math.max(0,parseInt(String(v).replace(/[^0-9-]/g,''),10)||0);
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const blank=t=>({table:t,customerName:'',startTime:'',endTime:'',extensions:0,extensionPrice:0,bottles:[],drinks:[],setEnabled:false,setPrice:50000,setQty:1,tcEnabled:false,tcPrice:3000,tcPeople:1,scEnabled:false,scRate:10,taxEnabled:true,roundUnit:100,memo:'',paymentMethod:'未選択',paid:false,updatedAt:Date.now()});
let data={selected:'V1',tables:Object.fromEntries(TABLES.map(t=>[t,blank(t)]))};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.tables){data=saved;TABLES.forEach(t=>data.tables[t]??=blank(t));}}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{data.tables[data.selected].updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(data));renderAll()};
const current=()=>data.tables[data.selected];
function calc(t){
 const bottles=t.bottles.reduce((s,x)=>s+x.price*x.qty,0), drinks=t.drinks.reduce((s,x)=>s+x.price*x.qty,0);
 const set=t.setEnabled?t.setPrice*t.setQty:0, tc=t.tcEnabled?t.tcPrice*t.tcPeople:0, ext=t.extensionPrice*t.extensions;
 const base=bottles+drinks+set+tc+ext, sc=t.scEnabled?Math.floor(base*t.scRate/100):0;
 const tax=t.taxEnabled?Math.floor((base+sc)*.1):0, before=base+sc+tax, unit=Math.max(1,t.roundUnit||1), total=Math.floor(before/unit)*unit;
 return{bottles,drinks,set,tc,ext,base,sc,tax,before,total};
}
function fmtDate(v){if(!v)return'未設定';const d=new Date(v);return isNaN(d)?v:d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function renderTableButtons(){ $('tableButtons').innerHTML=TABLES.map(t=>`<button class="table-btn ${t===data.selected?'active':''}" data-table="${t}">${t}</button>`).join(''); document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{data.selected=b.dataset.table;localStorage.setItem(KEY,JSON.stringify(data));loadForm();renderAll();});}
function renderTableList(){ $('tableList').innerHTML=TABLES.map(name=>{const t=data.tables[name],c=calc(t);return `<div class="table-card ${name===data.selected?'active':''}"><div class="table-head"><div class="table-name">${name}</div><span class="badge ${t.paid?'paid':'open'}">${t.paid?'会計済み':'営業中'}</span></div><div class="table-meta">${t.customerName||'名前未入力'} ／ 開始 ${fmtDate(t.startTime)} ／ 延長 ${t.extensions}回</div><div class="table-total">${yen(c.total)}</div><div class="table-actions"><button data-open="${name}">開く</button><button data-paid="${name}">${t.paid?'営業中に戻す':'会計済み'}</button><button data-reset="${name}">リセット</button></div></div>`}).join('');
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{data.selected=b.dataset.open;localStorage.setItem(KEY,JSON.stringify(data));loadForm();showBill();});
 document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{const t=data.tables[b.dataset.paid];t.paid=!t.paid;localStorage.setItem(KEY,JSON.stringify(data));renderAll();});
 document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{if(confirm(`${b.dataset.reset}を新規会計に戻しますか？`)){data.tables[b.dataset.reset]=blank(b.dataset.reset);localStorage.setItem(KEY,JSON.stringify(data));if(data.selected===b.dataset.reset)loadForm();renderAll();}});
}
function itemHtml(x,i,type){return `<div class="item"><div class="item-top"><div><div class="item-name">${escapeHtml(x.name||'名称未入力')}</div><div class="item-sub">${yen(x.price)} × ${x.qty} = ${yen(x.price*x.qty)}</div></div></div><div class="item-actions"><button class="icon-btn" data-minus="${type}:${i}">−</button><strong>${x.qty}</strong><button class="icon-btn" data-plus="${type}:${i}">＋</button><button class="danger" data-del="${type}:${i}">削除</button></div></div>`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function renderItems(){const t=current();$('bottleList').innerHTML=t.bottles.length?t.bottles.map((x,i)=>itemHtml(x,i,'b')).join(''):'<div class="empty">ボトルはまだありません</div>';$('drinkList').innerHTML=t.drinks.length?t.drinks.map((x,i)=>itemHtml(x,i,'d')).join(''):'<div class="empty">ドリンクはまだありません</div>';
 document.querySelectorAll('[data-minus],[data-plus],[data-del]').forEach(b=>b.onclick=()=>{const raw=b.dataset.minus||b.dataset.plus||b.dataset.del,[type,idx]=raw.split(':'),arr=type==='b'?current().bottles:current().drinks,i=Number(idx);if(b.dataset.del!==undefined)arr.splice(i,1);else if(b.dataset.plus!==undefined)arr[i].qty++;else arr[i].qty=Math.max(1,arr[i].qty-1);save();});}
function renderSummary(){const t=current(),c=calc(t);const rows=[['ボトル',c.bottles],['その他ドリンク',c.drinks],['セット',c.set],['TC',c.tc],['延長',c.ext],['SC '+(t.scEnabled?t.scRate+'%':'OFF'),c.sc],['TAX '+(t.taxEnabled?'10%':'OFF'),c.tax]];$('summary').innerHTML=rows.map(r=>`<div class="sum-row"><span>${r[0]}</span><strong>${yen(r[1])}</strong></div>`).join('')+`<div class="sum-row total-before"><span>端数処理前</span><strong>${yen(c.before)}</strong></div><div class="grand"><span>お会計</span><strong>${yen(c.total)}</strong></div>`;$('footerTotal').textContent=yen(c.total);$('footerTable').textContent=data.selected;$('selectedStatus').textContent=t.paid?'会計済み':'営業中';$('selectedStatus').className='badge '+(t.paid?'paid':'open');$('togglePaid').textContent=t.paid?'営業中に戻す':'会計済みにする';}
function renderAll(){renderTableButtons();renderTableList();renderItems();renderSummary();}
function loadForm(){const t=current();$('customerName').value=t.customerName;$('startTime').value=t.startTime;$('endTime').value=t.endTime;$('extensionCount').textContent=t.extensions;$('extensionPrice').value=t.extensionPrice;$('setEnabled').checked=t.setEnabled;$('setPrice').value=t.setPrice;$('setQty').value=t.setQty;$('tcEnabled').checked=t.tcEnabled;$('tcPrice').value=t.tcPrice;$('tcPeople').value=t.tcPeople;$('scEnabled').checked=t.scEnabled;$('taxEnabled').checked=t.taxEnabled;$('memo').value=t.memo;$('paymentMethod').value=t.paymentMethod;document.querySelectorAll('#scSegment button').forEach(b=>b.classList.toggle('active',Number(b.dataset.value)===t.scRate));document.querySelectorAll('#roundSegment button').forEach(b=>b.classList.toggle('active',Number(b.dataset.value)===t.roundUnit));renderAll();}
function showBill(){$('tablesView').classList.add('hidden');$('billView').classList.remove('hidden');$('tabTables').classList.remove('active');$('tabBill').classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function showTables(){$('billView').classList.add('hidden');$('tablesView').classList.remove('hidden');$('tabBill').classList.remove('active');$('tabTables').classList.add('active');window.scrollTo({top:0,behavior:'smooth'});renderTableList();}
$('tabTables').onclick=showTables;$('tabBill').onclick=showBill;
function bind(id,key,parser=v=>v){$(id).addEventListener('input',e=>{current()[key]=parser(e.target.type==='checkbox'?e.target.checked:e.target.value);save()})}
bind('customerName','customerName');bind('startTime','startTime');bind('endTime','endTime');bind('extensionPrice','extensionPrice',num);bind('setEnabled','setEnabled');bind('setPrice','setPrice',num);bind('setQty','setQty',v=>Math.max(1,num(v)));bind('tcEnabled','tcEnabled');bind('tcPrice','tcPrice',num);bind('tcPeople','tcPeople',v=>Math.max(1,num(v)));bind('scEnabled','scEnabled');bind('taxEnabled','taxEnabled');bind('memo','memo');bind('paymentMethod','paymentMethod');
$('extMinus').onclick=()=>{current().extensions=Math.max(0,current().extensions-1);$('extensionCount').textContent=current().extensions;save()};$('extPlus').onclick=()=>{current().extensions++;$('extensionCount').textContent=current().extensions;save()};
$('addBottle').onclick=()=>{const name=$('bottleName').value.trim(),price=num($('bottlePrice').value),qty=Math.max(1,num($('bottleQty').value));if(!name)return alert('ボトル名を入力してください');if(!price)return alert('価格を入力してください');current().bottles.push({name,price,qty});$('bottleName').value='';$('bottleQty').value='1';save()};
$('addDrink').onclick=()=>{const name=$('drinkName').value.trim(),price=num($('drinkPrice').value),qty=Math.max(1,num($('drinkQty').value));if(!name)return alert('ドリンク名を入力してください');if(!price)return alert('価格を入力してください');current().drinks.push({name,price,qty});$('drinkName').value='';$('drinkQty').value='1';save()};
document.querySelectorAll('#scSegment button').forEach(b=>b.onclick=()=>{current().scRate=Number(b.dataset.value);document.querySelectorAll('#scSegment button').forEach(x=>x.classList.toggle('active',x===b));save()});
document.querySelectorAll('#roundSegment button').forEach(b=>b.onclick=()=>{current().roundUnit=Number(b.dataset.value);document.querySelectorAll('#roundSegment button').forEach(x=>x.classList.toggle('active',x===b));save()});
function shareText(){const t=current(),c=calc(t),lines=[`🍾 JUMANJI HANDY`,`卓：${t.table}`,`お客様：${t.customerName||'未入力'}`,`開始：${fmtDate(t.startTime)}`,`終了予定：${fmtDate(t.endTime)}`,`延長：${t.extensions}回`,''];if(t.bottles.length){lines.push('【ボトル】');t.bottles.forEach(x=>lines.push(`・${x.name} ${yen(x.price)} × ${x.qty}`));}if(t.drinks.length){lines.push('','【その他ドリンク】');t.drinks.forEach(x=>lines.push(`・${x.name} ${yen(x.price)} × ${x.qty}`));}lines.push('','【内訳】',`セット：${yen(c.set)}`,`TC：${yen(c.tc)}`,`延長：${yen(c.ext)}`,`SC：${yen(c.sc)}`,`TAX：${yen(c.tax)}`,`支払方法：${t.paymentMethod}`,'──────────',`合計：${yen(c.total)}`);if(t.memo)lines.push('',`メモ：${t.memo}`);return lines.join('\n')}
$('shareLine').onclick=()=>{const text=shareText(),url='https://line.me/R/msg/text/?'+encodeURIComponent(text);window.location.href=url};
$('togglePaid').onclick=()=>{current().paid=!current().paid;save()};
$('resetTable').onclick=()=>{if(confirm(`${data.selected}の会計をすべてリセットしますか？`)){data.tables[data.selected]=blank(data.selected);localStorage.setItem(KEY,JSON.stringify(data));loadForm();}};
if(!current().startTime)current().startTime=nowLocal();loadForm();showTables();
})();
</script>
</body>
